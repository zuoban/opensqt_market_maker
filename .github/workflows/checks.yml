name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dependencies and source
        run: |
          go mod verify
          go vet ./...
      - name: Test with race detection
        run: go test -race ./... -count=1
      - name: Test dashboard
        run: node --test web/app_frontend_test.js
