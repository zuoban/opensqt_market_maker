# OpenSQT Market Maker
#
# 使用前：
#   cp config.example.yaml config.yaml
#   cp .env.example .env
# 在 .env 填写 API Key；策略参数可继续放在 config.yaml。
# 非空环境变量会覆盖 YAML。
#
# 拉取 GitHub Packages 私有镜像：
#   echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
#
# 启动：
#   docker compose up -d --build

services:
  market-maker:
    image: ghcr.io/zuoban/opensqt_market_maker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensqt_market_maker
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./log:/app/log
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
