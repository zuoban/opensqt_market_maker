# OpenSQT Market Maker
#
# 使用前：
#   cp .env.example .env
# 在 .env 填齐交易所密钥和策略参数即可，config.yaml 不是必须的。
# 若同时提供 YAML，非空环境变量仍会覆盖 YAML。
#
# 可选挂载 YAML：
#   volumes:
#     - ./config.yaml:/app/config.yaml:ro
#
# 拉取 GitHub Packages 私有镜像：
#   echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
#
# 启动：
#   docker compose up -d --build

services:
  market-maker:
    image: ghcr.io/zuoban/opensqt_market_maker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensqt_market_maker
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      - ./log:/app/log
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
