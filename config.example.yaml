# API Key 等敏感项可用环境变量覆盖，见 .env.example。非空 OPENSQT_* 优先于本文件。
# 项目固定使用 Binance，保留 exchanges.binance 路径以兼容已有配置。
exchanges:
  binance:
    # 币安 开户邀请码【OPENSQT】开户链接：https://accounts.maxweb.chat/register?ref=OPENSQT
    api_key: "YOUR_API_KEY"
    secret_key: "YOUR_API_SECRET"
    fee_rate: 0.0002  # USDT 合约 Maker 手续费率 0.02%（实际费率以账户为准）
####################################

trading:
  symbol: "ETHUSDT"
  price_interval: 2         # 价格间隔（1美元）
  order_quantity: 30        # 每单购买金额（USDT/USDC）如 30 表示每单投入30U
  min_order_value: 20       # 最小订单价值（USDT），小于此值不挂单（默认20U）
  max_margin_usage_percent: 100 # 最大允许占用保证金百分比，范围 (0, 100]，默认100
  # 注意：price_decimals 和 quantity_decimals 已移除，现在从交易所自动获取
  
  #ETH配置建议(每单赚1美分):
  #价格间隔：1 美元
  #订单金额：30 USDT（每单投入30U，价格3000时买0.01 ETH，价格1500时买0.02 ETH）
  #价格小数位数：2
  #数量小数位数：3

  #ETH配置建议(每单赚10美分):
  #价格间隔：10 美元
  #订单金额：300 USDT (每单投入300U，需要大量保证金)
  #价格小数位数：2

  #DOGE建议（每单赚2美分）：
  #价格间隔：0.0001 美元
  #订单金额：20 USDT（价格0.1时买200 DOGE，价格0.2时买100 DOGE）
  #价格小数位数：6

#####################################

  # 滑动窗口配置
  buy_window_size: 10          # 下方买单数量
  sell_window_size: 10         # 上方卖单数量

  # 对账配置
  reconcile_interval: 60      # 对账间隔（秒）

  # 订单管理配置
  # order_cleanup_threshold 必须大于 buy_window_size + sell_window_size，
  # 否则补单与清理会来回打架。密网格应先加大阈值，而不是把窗口开到 50+。
  order_cleanup_threshold: 100     # 订单清理上限（默认100，必须大于 buy+sell 窗口）
  cleanup_batch_size: 20           # 清理批次大小（每次清理的买单和卖单数量）
  margin_lock_duration_seconds: 20  # 保证金不足时锁定时间（秒，默认10秒）
  
  # 持仓安全性配置
  position_safety_check: 100        # 持仓安全性检查（默认100，最少能向下持有多少仓）

# 严格 Maker 执行策略。逻辑网格价保持不变，实际 BUY 委托在穿价时只允许
# 向更低、更有利的价格被动补挂；任何路径都不会降级成 Taker。
execution:
  maker_guard_ticks: 2                 # 距离对手最优价至少保留多少个 tick
  quote_stale_ms: 30000                # 市场数据流（成交或 bookTicker）静默超过此时长才暂停新提交；bookTicker 没变化不等于盘口失效
  post_only_retry_min_ms: 50           # -5022 首次退避
  post_only_retry_max_ms: 500          # -5022 指数退避上限
  post_only_retry_burst: 5             # 前 N 次走指数退避；超过后每次至少暂停 1 秒
  catch_up_mode: "passive"             # passive / exact_wait
  max_active_catch_up_slots: 1         # 同时最多一个穿价补格单
  max_catch_up_slots_per_adjust: 1      # 每轮最多创建一个补格单
  max_catch_up_distance_ratio: 0.5      # 最大补格距离占 price_interval 的比例
  near_touch_single_order_ratio: 0.15   # 距盘口过近的订单改用单笔提交
  max_gap_stack_slots: 0               # 默认关闭合并；1~10 为额外补买的已跨过漏买格数上限，单张买单最多为（此值+1）格金额


# 时间间隔配置
timing:
  # WebSocket相关
  websocket_reconnect_delay: 5      # WebSocket断线重连等待时间（秒，默认5）
  websocket_write_wait: 10          # WebSocket写入等待时间（秒，默认10）
  websocket_pong_wait: 60           # WebSocket PONG等待时间（秒，默认60）
  websocket_ping_interval: 20       # WebSocket PING间隔（秒，默认20）
  listen_key_keepalive_interval: 30 # listenKey保活间隔（分钟，默认30）

  # 价格监控相关
  price_send_interval: 50           # 定期发送价格的间隔（毫秒，默认50）

  # 订单执行相关
  rate_limit_retry_delay: 1         # 速率限制重试等待时间（秒，默认1）
  price_poll_interval: 500          # 等待获取价格的轮询间隔（毫秒，默认500）
  status_print_interval: 1          # 定期打印状态的间隔（分钟，默认1）
  order_cleanup_interval: 10        # 订单清理检查间隔（秒，默认10）

system:
  # 日志级别: DEBUG(调试) / INFO(信息) / WARN(警告) / ERROR(错误) / FATAL(致命)
  # DEBUG: 输出所有日志，包括调试信息（最详细）
  # INFO: 输出一般信息、警告、错误和致命错误（推荐生产环境）
  # WARN: 只输出警告、错误和致命错误
  # ERROR: 只输出错误和致命错误
  # FATAL: 只输出致命错误
  log_level: "INFO"
  cancel_on_exit: true        # 退出时撤销所有订单（默认开启true,关闭用false）

# 主动安全风控配置（基于移动平均线）
risk_control:
  enabled: true               # 是否启用风控（默认开启true,关闭用false）
  
  # 监控的主流币种（用于判断市场整体情绪）
  monitor_symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "XRPUSDT"
    - "DOGEUSDT"
  
  interval: "1m"              # K线周期：1m / 3m / 5m
  volume_multiplier: 3.0      # 成交量倍数：当前量 > 均值×3倍视为异常
  average_window: 20          # 移动平均窗口：50根K线
  recovery_threshold: 3       # 恢复交易所需的正常币种数量（默认3个币种恢复正常即可恢复交易）
  
  # 触发条件：当前价格 < 移动均价 且 成交量 > 均值×倍数
  # 解除条件：至少 recovery_threshold 个币种满足（当前价格 > 移动均价 且 成交量 < 均值×倍数）

# Telegram 订单全成交通知（可选，默认关闭）
# 先通过 @BotFather 创建 Bot，再向 Bot 发送 /start；群组需先添加 Bot。
# 推荐在 .env 中填写 Token 和 Chat ID，勿提交真实凭据。
telegram:
  enabled: false
  bot_token: ""             # OPENSQT_TELEGRAM_BOT_TOKEN
  chat_id: ""               # OPENSQT_TELEGRAM_CHAT_ID；私聊 ID / 群组负数 ID / @频道名

# 本地只读监控面板（嵌在主进程，不改交易逻辑）
dashboard:
  enabled: true
  listen: "127.0.0.1:8787"   # 默认只绑本机。写成 0.0.0.0 会对外暴露账户与仓位
  token: ""                  # 非空则访问 /api/snapshot 和 /ws 需要 ?token=
  push_interval_ms: 400      # WebSocket 推送间隔（最小200）
  account_refresh_sec: 10    # 账户余额刷新间隔
